<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>泡沫 · Foam</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background: radial-gradient(circle at 50% 40%, #0b1024 0%, #05060d 70%);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #scene {
    display: block;
    border-radius: 16px;
    background: #06080f;
    box-shadow:
      0 0 0 1px rgba(120,190,255,.14),
      0 0 60px rgba(60,140,255,.22),
      0 0 150px rgba(120,80,255,.14),
      0 30px 80px rgba(0,0,0,.6);
    touch-action: none;
    cursor: crosshair;
  }
  #hint {
    position: fixed; left:50%; bottom: 5%;
    transform: translateX(-50%);
    color: rgba(175,218,255,.82);
    font-size: 13px; line-height: 1.8;
    letter-spacing: .14em;
    text-align: center;
    pointer-events: none;
    transition: opacity 1.2s ease;
    text-shadow: 0 0 20px rgba(90,180,255,.8);
    white-space: nowrap;
  }
  #hint.hide { opacity: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="scene"></canvas></div>
<div id="hint">摇晃手机 —— 泛起泡沫<br>按住屏幕 —— 冲击波推开泡沫 · 轻点戳破</div>

<script>
(function () {
'use strict';

/* ============================================================
   基础设置  904 × 572
   ============================================================ */
const W = 904, H = 572;
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d', { alpha: false });
const DPR = Math.min(window.devicePixelRatio || 1, 2);

canvas.width  = Math.round(W * DPR);
canvas.height = Math.round(H * DPR);
ctx.scale(DPR, DPR);

function fit() {
  const s = Math.min(
    (window.innerWidth  - 28) / W,
    (window.innerHeight - 28) / H
  );
  const scale = Math.max(0.28, Math.min(s, 1.85));
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 200));
fit();

const TAU   = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand  = (a, b) => a + Math.random() * (b - a);

/* ============================================================
   预渲染精灵
   ============================================================ */
const HUE_STEPS = 24;
const SPRITES        = [];   // 光点（粒子/光晕）
const BUBBLE_SPRITES = [];   // 气泡贴图
const R_BUBBLE = 52;                       // 贴图内气泡半径
const S_BUBBLE = 128;                      // 贴图边长
const BUBBLE_K = S_BUBBLE / (R_BUBBLE * 2); // 绘制尺寸 = r * 2 * K

let WHITE_SPRITE = null;

(function buildSprites() {
  for (let i = 0; i < HUE_STEPS; i++) {
    const hue = i * (360 / HUE_STEPS);

    /* ---- 光点 ---- */
    {
      const S = 64;
      const c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
      grd.addColorStop(0.00, `hsla(${hue},100%,95%,1)`);
      grd.addColorStop(0.16, `hsla(${hue},100%,80%,0.72)`);
      grd.addColorStop(0.44, `hsla(${hue},100%,64%,0.24)`);
      grd.addColorStop(1.00, `hsla(${hue},100%,55%,0)`);
      g.fillStyle = grd;
      g.fillRect(0, 0, S, S);
      SPRITES.push(c);
    }

    /* ---- 气泡 ---- */
    {
      const c = document.createElement('canvas');
      c.width = c.height = S_BUBBLE;
      const g = c.getContext('2d');
      const cx = S_BUBBLE / 2, cy = S_BUBBLE / 2, R = R_BUBBLE;

      // 外发光
      const glow = g.createRadialGradient(cx, cy, R * 0.62, cx, cy, S_BUBBLE * 0.5);
      glow.addColorStop(0, `hsla(${hue},100%,80%,0.26)`);
      glow.addColorStop(1, `hsla(${hue},100%,70%,0)`);
      g.fillStyle = glow;
      g.fillRect(0, 0, S_BUBBLE, S_BUBBLE);

      // 皂膜主体
      const bg = g.createRadialGradient(cx - R*0.30, cy - R*0.34, R*0.02, cx, cy, R);
      bg.addColorStop(0.00, `hsla(${hue + 20},100%,99%,0.22)`);
      bg.addColorStop(0.18, `hsla(${hue + 10},100%,93%,0.07)`);
      bg.addColorStop(0.58, `hsla(${hue},100%,72%,0.045)`);
      bg.addColorStop(0.86, `hsla(${hue + 12},100%,90%,0.20)`);
      bg.addColorStop(1.00, `hsla(${hue + 28},100%,98%,0.52)`);
      g.fillStyle = bg;
      g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();

      // 高光
      const hl = g.createRadialGradient(
        cx - R*0.32, cy - R*0.40, 0,
        cx - R*0.32, cy - R*0.40, R*0.48
      );
      hl.addColorStop(0.0, 'rgba(255,255,255,0.72)');
      hl.addColorStop(0.5, 'rgba(255,255,255,0.16)');
      hl.addColorStop(1.0, 'rgba(255,255,255,0)');
      g.fillStyle = hl;
      g.beginPath(); g.arc(cx - R*0.32, cy - R*0.40, R*0.48, 0, TAU); g.fill();

      // 底部反光弧
      g.strokeStyle = `hsla(${hue + 45},100%,96%,0.38)`;
      g.lineWidth = R * 0.09;
      g.beginPath();
      g.arc(cx, cy, R * 0.79, Math.PI * 0.12, Math.PI * 0.50);
      g.stroke();

      BUBBLE_SPRITES.push(c);
    }
  }

  /* ---- 纯白发光（用于密集区域“发白”） ---- */
  {
    const S = 128;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    grd.addColorStop(0.00, 'rgba(255,255,255,0.95)');
    grd.addColorStop(0.30, 'rgba(255,255,255,0.42)');
    grd.addColorStop(0.62, 'rgba(225,240,255,0.14)');
    grd.addColorStop(1.00, 'rgba(200,225,255,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, S, S);
    WHITE_SPRITE = c;
  }
})();

function getSprite(hue) {
  let i = (hue / 15) | 0;
  i %= HUE_STEPS; if (i < 0) i += HUE_STEPS;
  return SPRITES[i];
}
function drawSprite(hue, x, y, size, alpha) {
  if (alpha <= 0.004 || size <= 0.4) return;
  ctx.globalAlpha = alpha > 1 ? 1 : alpha;
  ctx.drawImage(getSprite(hue), x - size * 0.5, y - size * 0.5, size, size);
  ctx.globalAlpha = 1;
}

/* ============================================================
   背景 & 氛围光斑
   ============================================================ */
const bgGrad = ctx.createLinearGradient(0, 0, W, H);
bgGrad.addColorStop(0.00, '#070c1c');
bgGrad.addColorStop(0.45, '#0a0a1e');
bgGrad.addColorStop(1.00, '#0d0718');

const vignette = ctx.createRadialGradient(W*0.5, H*0.5, H*0.34, W*0.5, H*0.5, H*1.06);
vignette.addColorStop(0, 'rgba(0,0,0,0)');
vignette.addColorStop(1, 'rgba(0,0,0,0.62)');

const blobs = [];
for (let i = 0; i < 6; i++) {
  blobs.push({
    x: rand(0, W), y: rand(0, H),
    r: rand(150, 330),
    hue: rand(180, 320),
    vx: rand(-9, 9), vy: rand(-9, 9),
    a: rand(0.028, 0.07),
    ph: rand(0, TAU)
  });
}

/* ============================================================
   密度网格（大量泡沫 → 发白）
   ============================================================ */
const CELL = 56;
const GW = Math.ceil(W / CELL) + 1;
const GH = Math.ceil(H / CELL) + 1;
const densGrid = new Float32Array(GW * GH);

function updateDensity() {
  densGrid.fill(0);
  for (let i = 0; i < bubbles.length; i++) {
    const b = bubbles[i];
    if (b.dead) continue;
    const cx = (b.x / CELL) | 0;
    const cy = (b.y / CELL) | 0;
    if (cx < 0 || cx >= GW || cy < 0 || cy >= GH) continue;
    densGrid[cy * GW + cx] += 0.35 + b.r * 0.055;
  }
}

function densityAt(x, y) {
  const cx = clamp((x / CELL) | 0, 0, GW - 1);
  const cy = clamp((y / CELL) | 0, 0, GH - 1);
  let s = 0;
  for (let dy = -1; dy <= 1; dy++) {
    const ny = cy + dy;
    if (ny < 0 || ny >= GH) continue;
    for (let dx = -1; dx <= 1; dx++) {
      const nx = cx + dx;
      if (nx < 0 || nx >= GW) continue;
      s += densGrid[ny * GW + nx];
    }
  }
  return s;
}

/* ============================================================
   实体容器
   ============================================================ */
const bubbles   = [];
const particles = [];
const waves     = [];

let tilt       = { x: 0, y: 0 };
let tiltTarget = { x: 0, y: 0 };
let shakePool  = 0;          // 摇晃能量池
let envTimer   = 0;
let elapsed    = 0;

/* ============================================================
   泡沫
   ============================================================ */
class Bubble {
  constructor(x, y, r) {
    this.x = x;
    this.y = y;
    this.r = r * 0.22;                 // 初始小 → 逐渐膨胀
    this.tr = r;                       // 目标半径
    this.vx = rand(-60, 60);
    this.vy = rand(-60, 60);
    this.life = 0;

    // 小泡泡寿命短，容易破
    this.maxLife = clamp(1.6 + r * 0.68, 2.2, 17) * rand(0.72, 1.28);

    this.hue = rand(178, 300);
    this.phase = rand(0, TAU);
    this.wobble = rand(0.6, 2.0);
    this.dead = false;
    this.dieNatural = false;
  }

  update(dt, gx, gy) {
    this.life += dt;
    if (this.life >= this.maxLife) {
      this.dead = true;
      this.dieNatural = true;
      return;
    }

    // 膨胀
    this.r += (this.tr - this.r) * Math.min(1, dt * 3.6);

    // 浮力
    this.vy -= 24 * dt;

    // 陀螺仪重力
    this.vx += gx * 300 * dt;
    this.vy += gy * 300 * dt;

    // 摇曳
    this.x += Math.sin(this.life * 2.3 + this.phase) * this.wobble * 15 * dt;

    // 阻尼
    const damp = Math.exp(-1.05 * dt);
    this.vx *= damp;
    this.vy *= damp;

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    /* --- 边界：绝不逾越 --- */
    const pad = this.r * 0.9;
    if (this.x < pad)            { this.x = pad;            this.vx = Math.abs(this.vx) * 0.45; }
    if (this.x > W - pad)        { this.x = W - pad;        this.vx = -Math.abs(this.vx) * 0.45; }
    if (this.y < pad)            { this.y = pad;            this.vy = Math.abs(this.vy) * 0.45; }
    if (this.y > H - pad)        { this.y = H - pad;        this.vy = -Math.abs(this.vy) * 0.45; }
  }

  get alpha() {
    const t = this.life / this.maxLife;
    const fadeIn = Math.min(1, this.life * 3.4);
    let fadeOut = 1;
    if (t > 0.60) {
      const k = (t - 0.60) / 0.40;
      fadeOut = Math.max(0, 1 - k);
      fadeOut *= fadeOut;
    }
    return fadeIn * fadeOut;
  }

  get radius() {
    const t = this.life / this.maxLife;
    return t > 0.60 ? this.r * (1 - (t - 0.60) * 0.50) : this.r;
  }
}

/* ============================================================
   生成 / 破裂
   ============================================================ */
function spawnBubbles(n, ambient) {
  for (let i = 0; i < n; i++) {
    let x, y, r;
    if (ambient) {
      x = rand(W * 0.06, W * 0.94);
      y = H - rand(12, 70);
      r = rand(5, 15);
    } else {
      x = rand(W * 0.05, W * 0.95);
      y = rand(H * 0.15, H * 0.95);
      r = rand(4, 26);
    }
    bubbles.push(new Bubble(x, y, r));
  }
  if (bubbles.length > 240) bubbles.splice(0, bubbles.length - 240);
}

function burstBubble(b, scale) {
  scale = scale || 1;

  const n = clamp(Math.round((5 + b.r * 0.85) * scale), 3, 24);
  for (let i = 0; i < n; i++) {
    const a  = Math.random() * TAU;
    const sp = rand(45, 50 + b.r * 7.5);
    particles.push({
      x: b.x + Math.cos(a) * b.r * 0.5,
      y: b.y + Math.sin(a) * b.r * 0.5,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 22,
      r: rand(1.0, 1.0 + b.r * 0.16),
      hue: b.hue + rand(-45, 45),
      life: 0,
      maxLife: rand(0.32, 0.9)
    });
  }

  particles.push({
    x: b.x, y: b.y, vx: 0, vy: 0,
    r: b.r * 0.36, hue: b.hue,
    life: 0, maxLife: 0.26
  });

  waves.push({
    x: b.x, y: b.y,
    r0: b.r * 0.5, r1: b.r * (3.0 + scale * 0.8),
    life: 0, maxLife: 0.44 * (0.8 + scale * 0.4),
    hue: b.hue, w: 2.2 * scale
  });
}

/* 戳破手指附近的泡泡 */
function popAt(x, y, radius) {
  let hit = 0;
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (b.dead) continue;
    const d = Math.hypot(b.x - x, b.y - y);
    if (d < radius + b.r * 0.35) {
      burstBubble(b, 1);
      bubbles.splice(i, 1);
      hit++;
    }
  }
  return hit;
}

/* 冲击波：推开周围泡泡 */
function shockwave(x, y, radius, power) {
  for (let i = 0; i < bubbles.length; i++) {
    const b = bubbles[i];
    if (b.dead) continue;
    const dx = b.x - x, dy = b.y - y;
    const d2 = dx*dx + dy*dy;
    if (d2 > radius * radius) continue;
    const d = Math.sqrt(d2);
    if (d < 0.6) {
      // 正中心：随机方向弹开
      const a = Math.random() * TAU;
      b.vx += Math.cos(a) * power;
      b.vy += Math.sin(a) * power;
      continue;
    }
    const f = 1 - d / radius;
    const imp = power * f * f;
    b.vx += (dx / d) * imp;
    b.vy += (dy / d) * imp;
  }
}

/* ============================================================
   输入：指针
   ============================================================ */
const pointer = { x: -999, y: -999, down: false, inside: false };
let lastPX = 0, lastPY = 0, lastPT = 0;

const hintEl = document.getElementById('hint');
let hintHidden = false;
function hideHint() {
  if (hintHidden) return;
  hintHidden = true;
  hintEl.classList.add('hide');
  setTimeout(() => { if (hintEl.parentNode) hintEl.remove(); }, 1400);
}

function toLocal(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (cx - r.left) / r.width  * W,
    y: (cy - r.top)  / r.height * H
  };
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  hideHint();
  enableMotion();

  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

  const p = toLocal(e.clientX, e.clientY);
  pointer.down = true;
  pointer.inside = true;
  pointer.x = p.x; pointer.y = p.y;
  lastPX = p.x; lastPY = p.y; lastPT = performance.now();

  // 1) 指尖正下方戳破
  popAt(p.x, p.y, 34);

  // 2) 冲击波推开周围
  shockwave(p.x, p.y, 200, 760);
  waves.push({
    x: p.x, y: p.y,
    r0: 6, r1: 230,
    life: 0, maxLife: 0.55,
    hue: 200, w: 3.0
  });
  waves.push({
    x: p.x, y: p.y,
    r0: 2, r1: 120,
    life: 0, maxLife: 0.35,
    hue: 210, w: 2.0
  });

}, { passive: false });

canvas.addEventListener('pointermove', (e) => {
  const p = toLocal(e.clientX, e.clientY);
  pointer.x = p.x; pointer.y = p.y; pointer.inside = true;

  if (pointer.down) {
    const moved = Math.hypot(p.x - lastPX, p.y - lastPY);
    if (moved > 2.5) popAt(p.x, p.y, 40);
  }

  lastPX = p.x; lastPY = p.y; lastPT = performance.now();
}, { passive: true });

canvas.addEventListener('pointerup',     () => { pointer.down = false; });
canvas.addEventListener('pointercancel', () => { pointer.down = false; });
canvas.addEventListener('pointerleave',  () => { pointer.inside = false; });

/* ============================================================
   输入：陀螺仪 / 运动（只负责摇晃，不理会手指滑动）
   ============================================================ */
let motionAttached = false;
let lastG = null;
let lastMotionT = 0;

function attachMotion() {
  if (motionAttached) return;
  motionAttached = true;
  window.addEventListener('devicemotion', onMotion, { passive: true });
  window.addEventListener('deviceorientation', onOrient, { passive: true });
}

function onMotion(e) {
  const now = performance.now();
  const dt  = Math.max(0.008, (now - lastMotionT) / 1000);
  lastMotionT = now;

  let intensity = 0;

  // 优先使用不含重力的线性加速度
  const a = e.acceleration;
  const useLinear = a && (a.x !== null || a.y !== null || a.z !== null) &&
                    (Math.abs(a.x || 0) + Math.abs(a.y || 0) + Math.abs(a.z || 0)) > 0.001;

  if (useLinear) {
    intensity = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
  } else {
    // 退化：用重力向量差分，抵消重力常量影响
    const g = e.accelerationIncludingGravity;
    if (!g || g.x === null) return;
    if (lastG) {
      const dx = g.x - lastG.x, dy = g.y - lastG.y, dz = g.z - lastG.z;
      intensity = Math.hypot(dx, dy, dz) / dt * 0.32;
    }
    lastG = { x: g.x, y: g.y, z: g.z };
  }

  // 阈值 + 能量注入
  const over = intensity - 3.0;
  if (over > 0) {
    shakePool = Math.min(34, shakePool + over * 0.10);
  }
}

/* 倾斜（陀螺仪倾向） */
let orientBase = null;

function onOrient(e) {
  if (e.gamma == null && e.beta == null) return;

  const gamma = e.gamma || 0;   // 左右
  const beta  = e.beta  || 0;   // 前后

  if (!orientBase) orientBase = { gamma, beta };

  // 极缓慢基线自适应，抵消长时间漂移
  orientBase.gamma += (gamma - orientBase.gamma) * 0.0005;
  orientBase.beta  += (beta  - orientBase.beta ) * 0.0005;

  const dg = gamma - orientBase.gamma;
  const db = beta  - orientBase.beta;

  // 屏幕方向补偿
  let ang = 0;
  if (screen.orientation && typeof screen.orientation.angle === 'number') {
    ang = screen.orientation.angle;
  } else if (typeof window.orientation === 'number') {
    ang = window.orientation;
  }

  let tx, ty;
  if (ang === 90)                        { tx =  db; ty = -dg; }
  else if (ang === -90 || ang === 270)   { tx = -db; ty =  dg; }
  else if (ang === 180)                  { tx = -dg; ty = -db; }
  else                                   { tx =  dg; ty =  db; }

  tiltTarget.x = clamp(tx / 22, -1, 1);
  tiltTarget.y = clamp(ty / 22, -1, 1);
}

function enableMotion() {
  const needPerm =
    (typeof DeviceMotionEvent !== 'undefined' &&
     typeof DeviceMotionEvent.requestPermission === 'function') ||
    (typeof DeviceOrientationEvent !== 'undefined' &&
     typeof DeviceOrientationEvent.requestPermission === 'function');

  if (!needPerm) { attachMotion(); return; }

  const req = (Ctor) => (
    Ctor && typeof Ctor.requestPermission === 'function'
      ? Ctor.requestPermission().catch(() => {})
      : Promise.resolve()
  );

  Promise.all([req(window.DeviceMotionEvent), req(window.DeviceOrientationEvent)])
    .then(() => attachMotion())
    .catch(() => {});
}

if (!(typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function')) {
  attachMotion();
}

/* ============================================================
   更新
   ============================================================ */
function update(dt) {
  elapsed += dt;

  /* --- 倾斜平滑 --- */
  const k = Math.min(1, dt * 4.0);
  tilt.x += (tiltTarget.x - tilt.x) * k;
  tilt.y += (tiltTarget.y - tilt.y) * k;

  /* --- 摇晃 → 泡沫 --- */
  if (shakePool > 0.6) {
    const n = Math.min(6, Math.floor(shakePool));
    if (n > 0) {
      spawnBubbles(n, false);
      shakePool -= n;
    }
  }
  shakePool *= Math.exp(-3.4 * dt);
  if (shakePool < 0.01) shakePool = 0;

  /* --- 环境自生 --- */
  envTimer -= dt;
  if (envTimer <= 0 && bubbles.length < 70) {
    envTimer = rand(0.45, 1.5);
    spawnBubbles(1, true);
  }

  /* --- 手指持续推力（按住时把泡泡推开） --- */
  if (pointer.down && pointer.inside) {
    const R = 130, R2 = R * R;
    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];
      if (b.dead) continue;
      const dx = b.x - pointer.x, dy = b.y - pointer.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < R2 && d2 > 1) {
        const d = Math.sqrt(d2);
        const f = 1 - d / R;
        const push = 980 * f * f * dt;
        b.vx += (dx / d) * push;
        b.vy += (dy / d) * push;
      }
    }
  }

  /* --- 泡沫 --- */
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.update(dt, tilt.x, tilt.y);
    if (b.dead) {
      if (b.dieNatural) burstBubble(b, 0.55);   // 自然破裂特效
      bubbles.splice(i, 1);
    }
  }

  /* --- 粒子 --- */
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
    p.vy += 95 * dt;
    const d = Math.exp(-1.6 * dt);
    p.vx *= d; p.vy *= d;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  /* --- 冲击波 --- */
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.life += dt;
    if (w.life >= w.maxLife) waves.splice(i, 1);
  }

  /* --- 氛围光斑 --- */
  for (const b of blobs) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.x < -b.r) b.x = W + b.r;
    if (b.x > W + b.r) b.x = -b.r;
    if (b.y < -b.r) b.y = H + b.r;
    if (b.y > H + b.r) b.y = -b.r;
    b.r += Math.sin(elapsed * 0.4 + b.ph) * 8 * dt;
  }

  updateDensity();
}

/* ============================================================
   绘制
   ============================================================ */
function drawBubble(b) {
  const a = b.alpha;
  if (a < 0.012) return;
  const r = b.radius;
  if (r < 0.6) return;

  const size = r * 2 * BUBBLE_K;

  // 色相索引
  let idx = (b.hue / 15) | 0;
  idx %= HUE_STEPS; if (idx < 0) idx += HUE_STEPS;

  ctx.globalAlpha = a;
  ctx.drawImage(BUBBLE_SPRITES[idx], b.x - size * 0.5, b.y - size * 0.5, size, size);
  ctx.globalAlpha = 1;

  // 密集区域叠加白色 → 大量气泡发白
  const d = densityAt(b.x, b.y);
  const w = Math.min(0.75, d * 0.05);
  if (w > 0.02) {
    const ws = size * (1.0 + w * 0.35);
    ctx.globalAlpha = Math.min(1, a * w * 1.05);
    ctx.drawImage(WHITE_SPRITE, b.x - ws * 0.5, b.y - ws * 0.5, ws, ws);
    ctx.globalAlpha = 1;
  }
}

function render() {
  /* --- 背景 --- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  /* --- 氛围光斑 --- */
  ctx.globalCompositeOperation = 'lighter';
  for (const b of blobs) {
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0.0, `hsla(${b.hue},90%,62%,${b.a})`);
    g.addColorStop(0.5, `hsla(${b.hue},90%,56%,${b.a * 0.34})`);
    g.addColorStop(1.0, `hsla(${b.hue},90%,50%,0)`);
    ctx.fillStyle = g;
    ctx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
  }

  /* --- 泡沫 --- */
  for (let i = 0; i < bubbles.length; i++) drawBubble(bubbles[i]);

  /* --- 粒子 --- */
  for (const p of particles) {
    const t = p.life / p.maxLife;
    const a = (1 - t) * (1 - t);
    if (a <= 0.01) continue;
    const size = p.r * 7 * (0.65 + 0.35 * (1 - t));
    drawSprite(p.hue, p.x, p.y, size, a * 0.85);
  }

  /* --- 冲击波 --- */
  for (const w of waves) {
    const t = w.life / w.maxLife;
    const ease = 1 - Math.pow(1 - t, 3);
    const r = w.r0 + (w.r1 - w.r0) * ease;
    const a = (1 - t) * (1 - t);
    ctx.strokeStyle = `hsla(${w.hue},100%,84%,${a * 0.65})`;
    ctx.lineWidth = Math.max(0.5, w.w * (1 - t));
    ctx.beginPath();
    ctx.arc(w.x, w.y, r, 0, TAU);
    ctx.stroke();
  }

  /* --- 指针光环 --- */
  if (pointer.inside && pointer.x > -500) {
    const px = pointer.x, py = pointer.y;
    const rr = pointer.down ? 130 : 80;
    const pulse = 1 + Math.sin(elapsed * 5) * 0.05;
    const g = ctx.createRadialGradient(px, py, 0, px, py, rr * pulse);
    g.addColorStop(0.0, `rgba(150,225,255,${pointer.down ? 0.18 : 0.07})`);
    g.addColorStop(0.65, `rgba(130,200,255,${pointer.down ? 0.05 : 0.02})`);
    g.addColorStop(1.0, 'rgba(120,190,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, rr * pulse, 0, TAU);
    ctx.fill();

    ctx.strokeStyle = `rgba(160,225,255,${pointer.down ? 0.30 : 0.13})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(px, py, rr * pulse, 0, TAU);
    ctx.stroke();
  }

  /* --- 暗角 --- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
}

/* ============================================================
   主循环
   ============================================================ */
let lastT = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);
  render();
}

// 开场泡沫
spawnBubbles(24, false);
updateDensity();
requestAnimationFrame(frame);

})();
</script>
</body>
